<title>Çizgi Takibi</title>
<style>
/*@@FONTS@@*/
/* Sabit 1600×900 sahne, ekrana göre ölçeklenir. Kâğıtlar her temada beyaz kalır; boya beyaz kâğıtta doğru görünür. */
:root{
  --ui:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --read:'Andika','Segoe UI','Trebuchet MS',system-ui,sans-serif;
  --bg:#B8865A;
  --wood1:#D9A877; --wood2:#C6915E; --seam:rgba(92,52,20,.22); --grain:rgba(255,255,255,.07);
  --sheet:#FFFEFA; --sheet-edge:rgba(70,40,15,.28);
  --paper:#FFFDF6; --paper-2:#FFFFFF; --paper-edge:#D9CBB8;
  --ink:#2A2620; --ink-soft:#6B6156; --on-wood:#FFF8EC; --title-shadow:#7A4A22;
  --good:#2E9A57; --good-deep:#1E7440; --bad:#D5473A; --bad-deep:#9E2F25; --focus:#1D6FE0; --gold:#F2B705;
  --shadow:rgba(60,32,10,.38); --scrim:rgba(40,22,8,.45);
  --road:rgba(120,150,185,.20); --road-edge:rgba(110,140,175,.35); --line:#55606C; --line-solid:#24272B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2A1C12; --wood1:#5A3D27; --wood2:#4A3120; --seam:rgba(0,0,0,.35); --grain:rgba(255,255,255,.04);
    --paper:#2A2622; --paper-2:#211E1A; --paper-edge:#120F0C; --ink:#F3EEE6; --ink-soft:#BFB4A6; --on-wood:#FFF3E2; --title-shadow:#120A04;
    --shadow:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.55); --sheet-edge:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2A1C12; --wood1:#5A3D27; --wood2:#4A3120; --seam:rgba(0,0,0,.35); --grain:rgba(255,255,255,.04);
  --paper:#2A2622; --paper-2:#211E1A; --paper-edge:#120F0C; --ink:#F3EEE6; --ink-soft:#BFB4A6; --on-wood:#FFF3E2; --title-shadow:#120A04;
  --shadow:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.55); --sheet-edge:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);touch-action:none}
body{font-family:var(--ui);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
[hidden]{display:none !important}

#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;margin:-450px 0 0 -800px;transform-origin:50% 50%;overflow:hidden;overflow:clip;
  background:repeating-linear-gradient(90deg,transparent 0 3px,var(--grain) 3px 4px,transparent 4px 37px),
    repeating-linear-gradient(180deg,transparent 0 178px,var(--seam) 178px 180px),
    linear-gradient(170deg,var(--wood1),var(--wood2))}
#home,#draw{position:absolute;inset:0}
#stage:not([data-screen="home"]) #home,#stage:not([data-screen="draw"]) #draw{display:none}

/* ---------- Ortak parçalar ---------- */
.chip{background:var(--paper);border-radius:22px;box-shadow:0 4px 0 var(--paper-edge),0 10px 20px -6px var(--shadow);display:flex;align-items:center}
.btn{border:0;border-radius:20px;font-family:var(--ui);font-weight:600;white-space:nowrap;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:10px}
.btn svg{width:1.05em;height:1.05em;flex:none}
.btn.go{background:var(--good);color:#fff;font-size:30px;padding:14px 34px;box-shadow:0 7px 0 var(--good-deep),0 14px 22px -8px var(--shadow)}
.btn.go:active{transform:translateY(5px);box-shadow:0 2px 0 var(--good-deep)}
.btn.plain{background:var(--paper);color:var(--ink);font-size:24px;padding:12px 24px;box-shadow:0 5px 0 var(--paper-edge),0 12px 20px -8px var(--shadow)}
.btn.plain:active{transform:translateY(4px);box-shadow:0 1px 0 var(--paper-edge)}
.btn.ghost{background:transparent;color:var(--ink-soft);font-size:22px;font-weight:500;padding:8px 14px;border-radius:12px}
.btn.danger{background:var(--bad);color:#fff;font-size:22px;padding:10px 20px;box-shadow:0 4px 0 var(--bad-deep)}
.ibtn{width:62px;height:62px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--paper-edge),0 10px 18px -6px var(--shadow);flex:none}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--paper-edge)}
.ibtn svg{width:30px;height:30px}
.ibtn.off{color:var(--ink-soft)}
.ibtn.armed,.btn.armed{background:var(--bad);color:#fff;box-shadow:0 4px 0 var(--bad-deep)}
.seg{display:inline-flex;gap:4px;padding:5px;border-radius:999px;background:rgba(120,96,70,.16)}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 18px;font-size:21px;font-weight:500;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- Ana ekran ---------- */
.h-top{position:absolute;left:44px;top:26px;right:44px;height:150px;display:flex;align-items:center;gap:26px}
.h-logo{width:118px;height:118px;flex:none;background:var(--sheet);border-radius:22px;transform:rotate(-4deg);box-shadow:0 3px 0 var(--sheet-edge),0 14px 26px -10px var(--shadow);display:grid;place-items:center}
.h-logo svg{width:96px;height:96px}
.h-title{flex:1;min-width:0}
.h-title h1{font-size:76px;font-weight:700;line-height:1;color:var(--on-wood);text-shadow:0 4px 0 var(--title-shadow),0 10px 22px rgba(0,0,0,.25);letter-spacing:.5px}
.h-title p{font-size:27px;color:var(--on-wood);opacity:.92;margin-top:10px;font-weight:500;text-shadow:0 2px 6px rgba(0,0,0,.25)}
.h-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.h-lay{padding:14px 18px 14px 22px;gap:14px}
.h-lay > span{font-size:21px;font-weight:600;color:var(--ink-soft);line-height:1.15}
.h-lay .seg button{font-size:22px;padding:9px 18px;display:inline-flex;align-items:center;gap:8px}
.h-lay .seg svg{width:30px;height:22px}
.h-set{font-size:22px;padding:10px 20px}
.h-acts{display:flex;gap:12px}
a.h-set{text-decoration:none;display:inline-flex;align-items:center;gap:8px;color:inherit}
a.h-set svg{width:24px;height:24px}
.grid{position:absolute;left:44px;top:196px;right:44px;bottom:26px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:22px 26px}
.card{position:relative;border:0;background:var(--sheet);border-radius:8px;box-shadow:0 2px 0 var(--sheet-edge),0 16px 26px -14px var(--shadow);transform:rotate(var(--r,0deg));transition:transform .12s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px 10px;color:#2A2620}
.card:active{transform:rotate(var(--r,0deg)) scale(.96)}
.card .th{width:100%;flex:1;min-height:0;display:block}
.card b{font-size:25px;font-weight:600;margin-top:6px;line-height:1.1}
.card.mix .th{display:grid;place-items:center}
.card.mix .dice{width:96px;height:96px}

/* ---------- Çizim ekranı: üst çubuk ---------- */
#topbar{position:absolute;left:16px;top:14px;right:16px;height:70px;display:flex;align-items:center;gap:12px;z-index:5}
#topbar .ibtn{width:62px;height:62px}
.tpl-chip{height:66px;padding:0 8px;gap:4px}
.tpl-chip .ar{width:52px;height:52px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--ink)}
.tpl-chip .ar:active{background:rgba(120,96,70,.16)}
.tpl-chip .ar svg{width:30px;height:30px}
.tpl-name{display:flex;align-items:center;gap:12px;min-width:250px;padding:0 6px;font-size:28px;font-weight:600;white-space:nowrap}
.tpl-name svg{width:68px;height:34px;background:#fff;border-radius:6px;box-shadow:inset 0 0 0 2px #E8DCCB;flex:none}
.tpl-name span.armed{color:var(--bad);font-size:20px;white-space:normal;line-height:1.1;max-width:230px}
.prog{height:66px;padding:0 22px;gap:14px;flex:1;min-width:0;max-width:420px}
.prog .bar{flex:1;height:18px;border-radius:9px;background:rgba(120,96,70,.18);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#3FB068,#7BD389);transition:width .25s}
.prog b{font-size:26px;font-weight:600;min-width:64px;text-align:right}
.prog .stars{display:flex;gap:2px}
.prog .stars svg{width:26px;height:26px;color:rgba(120,96,70,.3)}
.prog .stars svg.on{color:var(--gold)}
.tb-sp{flex:1}
.tb-lbl{font-size:26px;font-weight:600;color:var(--on-wood);text-shadow:0 2px 0 var(--title-shadow);white-space:nowrap}
.btn.tbb{height:62px;font-size:22px;padding:0 20px}

/* ---------- Paneller ---------- */
#panels{position:absolute;left:0;top:0;width:1600px;height:900px}
.pn{position:absolute}
.pn-head{position:absolute;left:0;right:0;top:0;height:48px;display:flex;align-items:center;gap:6px}
.pn-no{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.pn-tpl{flex:1;min-width:0;height:44px;padding:0 4px;border-radius:14px}
.pn-tpl .ar{width:38px;height:38px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);border-radius:50%;flex:none}
.pn-tpl .ar svg{width:24px;height:24px}
.pn-tpl span{flex:1;min-width:0;text-align:center;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-tpl span.armed{color:var(--bad);font-size:15px;white-space:normal;line-height:1.05}
.pn-head .ibtn{width:44px;height:44px}
.pn-head .ibtn svg{width:22px;height:22px}
.pn-bar{position:absolute;left:52px;right:0;top:46px;height:6px;border-radius:3px;background:rgba(0,0,0,.12);overflow:hidden}
.pn-bar i{display:block;height:100%;width:0;background:#3FB068;transition:width .25s}
.pp{position:absolute;background:var(--sheet);border-radius:6px;box-shadow:0 2px 0 var(--sheet-edge),0 18px 30px -16px var(--shadow);overflow:hidden;touch-action:none}
.pp canvas,.pp svg.gd,.pp svg.mk{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
.pp .road{fill:none;stroke:var(--road);stroke-linecap:round;stroke-linejoin:round}
.pp .line{fill:none;stroke:var(--line);stroke-linecap:round;stroke-linejoin:round}
.pp.solid .line{stroke:var(--line-solid)}
.pp .st circle{fill:#2E9A57;stroke:#fff;stroke-width:3}
.pp .st .arw path{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
.pp .st .ok{display:none;fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.pp .st.done circle{fill:#F2B705}
.pp .st.done .arw{display:none}
.pp .st.done .ok{display:block}
.pp .en path{fill:#FFC531;stroke:#E59A00;stroke-width:2.5;stroke-linejoin:round}
.pp .en.done path{fill:#FFE27A}
.pp.nomarks .st,.pp.nomarks .en{display:none}
.pp .st.pulse circle{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:9;stroke:rgba(46,154,87,.35)}}
.pp .demo{fill:none;stroke:#FF8B3A;stroke-linecap:round;stroke-linejoin:round;opacity:.9;transition:opacity .6s}
.pp .demo-dot{fill:#FFD84D;stroke:#FF8B3A;stroke-width:5}
.pp.fade .demo,.pp.fade .demo-dot{opacity:0}

/* Kutlama şeridi */
.cel{position:absolute;left:50%;top:18px;transform:translate(-50%,-140%);background:var(--paper);color:var(--ink);border-radius:22px;padding:12px 18px 12px 24px;display:flex;align-items:center;gap:16px;
  box-shadow:0 6px 0 var(--paper-edge),0 20px 30px -10px var(--shadow);transition:transform .45s cubic-bezier(.2,1.4,.4,1);z-index:3;max-width:94%}
.cel.on{transform:translate(-50%,0)}
.cel .cs{display:flex;gap:2px;flex:none}
.cel .cs svg{width:40px;height:40px;color:#D9CBB8}
.cel .cs svg.on{color:var(--gold);animation:pop .5s backwards}
.cel .cs svg:nth-child(2){animation-delay:.15s}.cel .cs svg:nth-child(3){animation-delay:.3s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.cel b{display:block;font-size:30px;font-weight:700;line-height:1.1}
.cel small{display:block;font-size:19px;color:var(--ink-soft);margin-top:2px}
.cel .btn{font-size:20px;padding:8px 16px}
.L4 .cel{flex-wrap:wrap;justify-content:center;padding:10px 12px;gap:6px 10px;text-align:center}
.L4 .cel .cs svg{width:30px;height:30px}
.L4 .cel b{font-size:22px}
.L4 .cel small{font-size:15px}

/* Araç çubuğu */
.tbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:18px;--cur:#E53935}
.sws{display:flex;gap:8px}
.sw{width:var(--s);height:var(--s);border-radius:50%;border:0;padding:0;background:var(--c);flex:none;position:relative;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.35),0 3px 0 rgba(0,0,0,.25);transition:transform .1s}
.sw.rb{background:conic-gradient(#E53935,#FB8C00,#FDD835,#7CB342,#00ACC1,#1E88E5,#8E24AA,#EC407A,#E53935)}
.sw[aria-pressed="true"]{transform:translateY(-5px) scale(1.04);box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink),0 8px 12px -4px rgba(0,0,0,.4);z-index:1}
.sw[aria-pressed="true"]::after{content:"";position:absolute;inset:30%;border-radius:50%;background:rgba(255,255,255,.85)}
.tls,.szs{display:flex;gap:8px}
.tool,.tbtn{border:0;border-radius:18px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none;
  box-shadow:0 4px 0 var(--paper-edge),0 10px 16px -8px var(--shadow);font-weight:600}
.tool svg,.tbtn svg{display:block}
.tool[aria-pressed="true"]{background:#FFE9A8;color:#2A2620;box-shadow:0 0 0 4px var(--ink),0 4px 0 4px var(--ink)}
.tool:active,.tbtn:active{transform:translateY(3px)}
.tbtn:disabled{opacity:.4;transform:none}
.size i{display:block;border-radius:50%;background:var(--cur)}
.size.rb i,.tbar.rb .size i{background:conic-gradient(#E53935,#FDD835,#00ACC1,#8E24AA,#E53935)}
.sep{width:2px;align-self:stretch;margin:14px 0;background:rgba(255,255,255,.35);border-radius:1px}
/* 1 çocuk */
.L1 .sw{--s:52px}
.L1 .tool,.L1 .tbtn{width:88px;height:86px;font-size:18px}
.L1 .tool svg,.L1 .tbtn svg{width:48px;height:48px}
.L1 .size{width:54px}
/* 2 çocuk */
.L2 .tbar{flex-wrap:wrap;row-gap:12px;gap:10px;align-content:flex-end}
.L2 .sws{flex-basis:100%;justify-content:center}
.L2 .sw{--s:48px}
.L2 .tool,.L2 .tbtn{width:76px;height:70px;font-size:15px}
.L2 .tool svg,.L2 .tbtn svg{width:38px;height:38px}
.L2 .size{width:52px}
.L2 .sep{display:none}
/* 4 çocuk */
.L4 .tbar{flex-direction:column;gap:10px}
.L4 .sws{display:grid;grid-template-columns:repeat(7,44px);gap:8px 8px;justify-content:center}
.L4 .sw{--s:44px}
.L4 .tls{gap:6px}
.L4 .row3{display:flex;gap:6px}
.L4 .tool,.L4 .tbtn{width:57px;height:58px;font-size:0}
.L4 .tool svg,.L4 .tbtn svg{width:36px;height:36px}
.L4 .sep{display:none}

/* ---------- Pencere, bildirim, efekt ---------- */
#fx{position:absolute;left:0;top:0;width:1600px;height:900px;z-index:40;pointer-events:none}
#modal{position:absolute;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center}
.sheet{position:relative;width:960px;max-height:840px;overflow-y:auto;touch-action:pan-y;background:var(--paper);border-radius:26px;padding:34px 44px 28px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.sheet h2{font-size:40px;font-weight:700;margin-bottom:6px}
.sheet .lead{font-size:22px;color:var(--ink-soft);margin-bottom:14px;line-height:1.4}
.sheet-x{position:absolute;right:18px;top:16px;width:56px;height:56px;border:0;border-radius:50%;background:transparent;color:var(--ink-soft);display:grid;place-items:center}
.sheet-x svg{width:30px;height:30px}
.set-h{font-size:19px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--focus);margin:22px 0 2px}
.set-row{display:flex;align-items:center;gap:20px;padding:12px 0;border-top:2px solid var(--paper-edge)}
.set-row.top{align-items:flex-start}
.set-row > div:first-child{width:290px;flex:none}
.set-row > div.grow{flex:1;min-width:0}
.set-row b{display:block;font-size:24px;font-weight:600}
.set-row small{display:block;font-size:17px;color:var(--ink-soft);line-height:1.3;margin-top:2px}
.set-row .seg{flex-wrap:wrap}
.set-row .seg button{font-size:21px;padding:8px 18px}
.set-row .seg.voices{border-radius:24px;display:flex}
.seg.voices .vg{font-size:15px;margin-left:8px;opacity:.7}
.voice-test{display:flex;align-items:center;gap:16px;margin-top:12px;flex-wrap:wrap}
.voice-test .btn{font-size:22px;padding:8px 22px}
.voice-test .info{margin-top:0}
.voice-test .info b{display:inline;font-size:inherit}
.info{font-size:18px;color:var(--ink-soft);margin-top:6px;line-height:1.35}
.info.warn{color:var(--bad)}
.sheet-foot{display:flex;justify-content:flex-end;gap:14px;margin-top:22px;align-items:center}
#toast{position:absolute;left:800px;bottom:130px;z-index:60;transform:translate(-50%,20px);background:#2A2620;color:#FFF8EC;font-size:24px;font-weight:500;
  padding:12px 28px;border-radius:999px;opacity:0;transition:opacity .2s,transform .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#stage[data-screen="draw"] #toast{bottom:auto;top:104px;transform:translate(-50%,-20px)}
#stage[data-screen="draw"] #toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

<div id="stage" data-screen="home">
  <section id="home" aria-label="Ana menü">
    <div class="h-top">
      <div class="h-logo" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M12 70c10-22 18-22 26 0s16 22 24 0 16-22 26 0" fill="none" stroke="#24272B" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 7"/><path d="M12 70c10-22 18-22 26 0s10 18 16 10" fill="none" stroke="#E53935" stroke-width="9" stroke-linecap="round"/><g transform="rotate(38 62 34)"><rect x="54" y="2" width="16" height="44" rx="3" fill="#FFC531"/><rect x="54" y="2" width="16" height="9" rx="3" fill="#F48FB1"/><rect x="54" y="11" width="16" height="4" fill="#B8C2CC"/><path d="M54 46h16l-8 14z" fill="#F3D3A6"/><path d="M59.5 55h5l-2.5 5z" fill="#E53935"/></g></svg></div>
      <div class="h-title"><h1>Çizgi Takibi</h1><p>Bir desen seç. Çizginin üzerinden geç, sonra istersen boya.</p></div>
      <div class="h-side">
        <div class="chip h-lay"><span>Tahtada kaç<br>çocuk çizecek?</span><div class="seg" id="laySeg" role="group" aria-label="Tahtadaki çocuk sayısı"></div></div>
        <div class="h-acts"><a class="btn plain h-set" id="listBtn" href="../index.html" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Oyun listesi</a><button type="button" class="btn plain h-set" id="setBtn"></button></div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="draw" aria-label="Çizim">
    <div id="topbar"></div>
    <div id="panels"></div>
  </section>

  <canvas id="fx" width="1600" height="900" aria-hidden="true"></canvas>
  <div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';
/* Akıllı tahtada iki çocuk aynı anda ters yönlere sürüklerken tarayıcı sayfayı yakınlaştırmasın. */
(function () {

    get(col, v) {

  const go = () => { setTemplate(p, nextId(p.tplId, d)); if (layout === 1) renderTopbar(); };
  if (!p.actions.length || (label && label.classList.contains('armed') && label._d === d)) { if (label) { clearTimeout(label._t); label.classList.remove('armed'); } go(); return; }
  if (!label) { go(); return; }
  label.classList.add('armed'); label._d = d; label.textContent = 'Çizim silinecek. Tekrar dokun.';
  clearTimeout(label._t); label._t = setTimeout(() => { label.classList.remove('armed'); label.textContent = TPL(p.tplId).name; }, 3000);
}

/* ---------- Nasıl çizilir? gösterimi ---------- */
function startDemo(p) {
  stopDemo(p);
  if (!p.strokes.length) { toast('Boş kâğıtta istediğini çiz.'); return; }
  const g = p.mk.querySelector('.demo-g'); g.innerHTML = '';
  p.pp.classList.remove('fade');
  const total = p.strokes.reduce((a, s) => a + s.len, 0), speed = clamp(total / 6, 320, 1500), w = Math.max(6, p.road * 0.36);
  let k = 0, t0 = 0, path = null, dotEl = null, L = 0;
  const begin = () => {
    const s = p.strokes[k];
    path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'demo'); path.setAttribute('d', pathD(s.pts) + (s.closed ? 'Z' : '')); path.setAttribute('stroke-width', w);
    g.appendChild(path);
    L = path.getTotalLength ? path.getTotalLength() : s.len;
    path.style.strokeDasharray = L + ' ' + (L + 10); path.style.strokeDashoffset = L;
    if (!dotEl) { dotEl = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); dotEl.setAttribute('class', 'demo-dot'); dotEl.setAttribute('r', clamp(p.road * 0.32, 10, 20)); g.appendChild(dotEl); }
    t0 = performance.now();
  };
  const step = now => {
    if (!path) begin();
    const f = Math.min(1, (now - t0) / (L / speed * 1000));
    path.style.strokeDashoffset = L * (1 - f);
    const pt = path.getPointAtLength ? path.getPointAtLength(L * f) : { x: 0, y: 0 };
    dotEl.setAttribute('cx', pt.x); dotEl.setAttribute('cy', pt.y);
    if (f >= 1) { k++; path = null; if (k >= p.strokes.length) { p.demoRaf = 0; p.pp.classList.add('fade'); p.demoT = setTimeout(() => { g.innerHTML = ''; p.pp.classList.remove('fade'); }, 900); return; } }
    p.demoRaf = requestAnimationFrame(step);
  };
  p.demoRaf = requestAnimationFrame(step);
  if (layout === 1) tts.say('Yeşil noktadan başla. Çizginin üzerinden yıldıza kadar git.');
}
function stopDemo(p) {
  if (p.demoRaf) cancelAnimationFrame(p.demoRaf);
  p.demoRaf = 0; clearTimeout(p.demoT);
  const g = p.mk && p.mk.querySelector('.demo-g'); if (g) g.innerHTML = '';
  if (p.pp) p.pp.classList.remove('fade');
}

/* ---------- Kutlama ---------- */
function celebrate(p) {
  p.done = true;
  const n = starsOf(p);
  p.cel.querySelectorAll('.cs svg').forEach((s, k) => { s.classList.toggle('on', k < n); s.style.animation = 'none'; void s.offsetWidth; s.style.animation = ''; });
  $('b', p.cel).textContent = layout === 4 ? 'Aferin!' : (n === 3 ? 'Aferin, harika!' : 'Aferin!');
  $('small', p.cel).textContent = n === 3 ? 'Çizgiyi taşırmadan izledin. İstersen şimdi boya.' : 'Çizgiyi tamamladın. İstersen şimdi boya.';
  p.cel.classList.add('on');
  clearTimeout(p.celT); p.celT = setTimeout(() => hideCel(p), 6500);
  sfx.win();
  const r = p.pp.getBoundingClientRect(), s = stage.getBoundingClientRect();
  confetti((r.left + r.width / 2 - s.left) / scale, (r.top + r.height * 0.35 - s.top) / scale, layout === 4 ? 50 : 110);
  tts.say(layout > 1 ? `Aferin ${p.i + 1} numara! Çizgiyi tamamladın.` : (n === 3 ? 'Aferin! Çizgiyi hiç taşırmadan izledin. İstersen şimdi boyayabilirsin.' : 'Aferin! Çizgiyi tamamladın. İstersen şimdi boyayabilirsin.'));
}
function hideCel(p, now) { clearTimeout(p.celT); p.cel.classList.remove('on'); }

/* =========================================================
   Ekranlar
   ========================================================= */
function show(scr) { stage.dataset.screen = scr; }
function layoutRects(n) {
  if (n === 1) return [{ x: 16, y: 96, w: 1568, h: 794 }];
  if (n === 2) return [0, 1].map(i => ({ x: 16 + i * 792, y: 96, w: 776, h: 794 }));
  const w = (1600 - 32 - 36) / 4;
  return [0, 1, 2, 3].map(i => ({ x: 16 + i * (w + 12), y: 96, w, h: 794 }));
}
function openDraw(id) {
  panels.forEach(stopDemo);
  layout = settings.layout;
  const box = $('#panels'); box.innerHTML = ''; box.className = 'L' + layout;
  const ids = id === MIX ? shuffleArr(ORDER_IDS.filter(x => x !== 'bos')).slice(0, layout) : [];
  panels = layoutRects(layout).map((r, i) => { const p = Panel(i, r, id); box.appendChild(p.el); return p; });
  show('draw');
  renderTopbar();
  panels.forEach((p, i) => setTemplate(p, id === MIX ? ids[i % ids.length] : id, true));
  if (layout === 1) renderTopbar();
  if (layout === 1) speakTpl(panels[0]);
  else tts.say('Herkes kendi kâğıdında yeşil noktadan başlasın. Çizginin üzerinden geçin.');
}
function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function speakTpl(p) {
  if (layout > 1) return;
  if (p.tplId === 'bos') tts.say('Boş kâğıt. İstediğin renkle istediğini çiz.');
  else tts.say(`${TPL(p.tplId).name}. Yeşil noktadan başla, çizginin üzerinden geç.`);
}
function renderTopbar() {
  const tb = $('#topbar');
  const left = `<button type="button" class="ibtn" data-t="home" aria-label="Desenlere dön">${ICON.home}</button>`;
  const right = `<button type="button" class="btn plain tbb" data-t="demo">${ICON.play}Nasıl çizilir?</button>
    <button type="button" class="ibtn" data-t="clear" aria-label="${layout === 1 ? 'Kâğıdı temizle' : 'Bütün kâğıtları temizle'}">${ICON.trash}</button>
    <button type="button" class="ibtn" data-t="save" aria-label="Resmi kaydet">${ICON.save}</button>
    <button type="button" class="ibtn" id="sndBtn" data-t="sound" aria-label="Ses"></button>
    <button type="button" class="ibtn" data-t="settings" aria-label="Öğretmen ayarları">${ICON.gear}</button>`;
  if (layout === 1) {
    const p = panels[0], id = p ? p.tplId : 'duz';
    tb.innerHTML = left + `<div class="chip tpl-chip"><button type="button" class="ar" data-t="prev" aria-label="Önceki desen">${ICON.prev}</button><span class="tpl-name" id="tplName">${miniThumb(id)}<span>${esc(TPL(id).name)}</span></span><button type="button" class="ar" data-t="next" aria-label="Sonraki desen">${ICON.next}</button></div>
      <div class="chip prog" id="prog"><div class="bar"><i></i></div><b>%0</b></div><span class="tb-sp"></span>` + right;
    if (p && p.cps) updateProgress(p);
  } else {
    tb.innerHTML = left + `<span class="tb-lbl">Çizgi Takibi · ${layout} çocuk</span><div class="chip tpl-chip"><button type="button" class="ar" data-t="prevAll" aria-label="Herkese önceki desen">${ICON.prev}</button><span class="tpl-name" style="min-width:210px;justify-content:center;font-size:22px">Herkese aynı desen</span><button type="button" class="ar" data-t="nextAll" aria-label="Herkese sonraki desen">${ICON.next}</button></div><span class="tb-sp"></span>` + right;
  }
  updateSoundBtn();
}
function miniThumb(id) {
  if (id === 'bos') return '<svg viewBox="0 0 1568 678" aria-hidden="true"></svg>';
  const s = buildTpl(id, 1568, 678, ROAD[settings.road]);
  return `<svg viewBox="0 0 1568 678" aria-hidden="true">${s.map(x => `<path d="${pathD(x.pts)}" fill="none" stroke="#24272B" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}</svg>`;
}
function renderTopProgress(p, v) {
  const pr = $('#prog'); if (!pr) return;
  pr.querySelector('.bar i').style.width = v + '%';
  pr.querySelector('b').textContent = p.strokes.length ? `%${v}` : '—';
}
$('#topbar').addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  audio.get();
  const k = b.dataset.t, p = panels[0];
  if (k === 'home') goHome();
  else if (k === 'prev' || k === 'next') stepTpl(p, k === 'next' ? 1 : -1, $('#tplName span'));
  else if (k === 'prevAll' || k === 'nextAll') armAll(b, k === 'nextAll' ? 1 : -1);
  else if (k === 'demo') panels.forEach(startDemo);
  else if (k === 'clear') armClear(b, () => panels.forEach(clearPanel));
  else if (k === 'save') saveImage();
  else if (k === 'sound') { settings.sound = !settings.sound; saveSettings(); if (!settings.sound) tts.hush(); }
  else if (k === 'settings') openSettings();
});
/* Tek kâğıtta, çizim varken desen değiştirirken bir kez uyar. */
let topArm = null;
function armAll(btn, d) {
  const dirty = panels.some(p => p.actions.length);
  if (dirty && topArm !== d) { topArm = d; toast('Bütün çizimler silinecek. Tekrar dokun.'); clearTimeout(armAll.t); armAll.t = setTimeout(() => { topArm = null; }, 3000); return; }
  topArm = null;
  const id = nextId(panels[0].tplId, d);
  panels.forEach(p => setTemplate(p, id, true));
}
function goHome() { panels.forEach(stopDemo); tts.hush(); show('home'); renderHome(); }
function updateSoundBtn() {
  const s = $('#sndBtn'); if (!s) return;
  s.innerHTML = settings.sound ? ICON.soundOn : ICON.soundOff; s.classList.toggle('off', !settings.sound);
  s.setAttribute('aria-label', settings.sound ? 'Sesi kapat' : 'Sesi aç');
}

/* ---------- Ana ekran ---------- */
const LAY_ICON = n => `<svg viewBox="0 0 30 22" aria-hidden="true">${Array.from({ length: n }, (_, i) => { const w = (28 - (n - 1) * 2) / n; return `<rect x="${1 + i * (w + 2)}" y="2" width="${w}" height="18" rx="2.5" fill="currentColor" opacity="${0.55 + 0.45 * (i % 2 ? 0.6 : 1)}"/>`; }).join('')}</svg>`;
function renderHome() {
  $('#laySeg').innerHTML = [1, 2, 4].map(n => `<button type="button" data-l="${n}" aria-pressed="${settings.layout === n}">${LAY_ICON(n)}${n}</button>`).join('');
  $('#setBtn').innerHTML = ICON.gear + 'Ayarlar';
  const rot = [-1.2, 0.8, -0.5, 1.1, 0.4, -0.9, 1.3, -0.3, 0.6, -1.1, 0.9, -0.6];
  $('#grid').innerHTML = TPLS.map((t, i) => `<button type="button" class="card" data-id="${t.id}" style="--r:${rot[i]}deg">${thumbSVG(t.id, 1568, 678)}<b>${esc(t.name)}</b></button>`).join('') +
    `<button type="button" class="card mix" data-id="${MIX}" style="--r:${rot[11]}deg"><span class="th"><svg class="dice" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="6" width="52" height="52" rx="12" fill="#FFC531" stroke="#24272B" stroke-width="3"/><g fill="#24272B"><circle cx="20" cy="20" r="5"/><circle cx="44" cy="20" r="5"/><circle cx="32" cy="32" r="5"/><circle cx="20" cy="44" r="5"/><circle cx="44" cy="44" r="5"/></g></svg></span><b>Karışık desen</b></button>`;
}
$('#laySeg').addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (!b) return; settings.layout = +b.dataset.l; saveSettings(); renderHome(); sfx.pick(); });
$('#grid').addEventListener('click', e => { const c = e.target.closest('[data-id]'); if (!c) return; audio.get(); openDraw(c.dataset.id); });
/* Site ya da zip içinden açıldıysa (…/oyunlar/oyun.html) oyun listesine dönüş düğmesi görünür; Claude sayfasında gizli kalır. */
try { if (/\/oyunlar\/[^/]+\.html$/i.test(location.pathname)) $('#listBtn').hidden = false; } catch (e) {}
$('#setBtn').addEventListener('click', openSettings);

/* =========================================================
   Öğretmen ayarları
   ========================================================= */
let modalOnClose = null;
function openModal(html, mount, onClose) {
  const m = $('#modal'), old = $('#sheet'), s = old.cloneNode(false);
  old.replaceWith(s); s.className = 'sheet'; s.innerHTML = html; s.setAttribute('aria-labelledby', 'mTitle'); s.scrollTop = 0;
  m.hidden = false; modalOnClose = onClose || null;
  if (mount) mount(s);
}
function closeModal() { $('#modal').hidden = true; $('#sheet').innerHTML = ''; const cb = modalOnClose; modalOnClose = null; if (cb) cb(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); return; }
  if (stage.dataset.screen === 'draw' && layout === 1 && $('#modal').hidden && panels[0]) {
    if (e.key === 'ArrowRight') stepTpl(panels[0], 1, $('#tplName span'));
    else if (e.key === 'ArrowLeft') stepTpl(panels[0], -1, $('#tplName span'));
  }
});
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
const SEGS = [
  { key: 'road', label: 'Yol genişliği', hint: 'Çizginin çevresindeki açık renkli yol. İnce yol daha dikkat ister.', opts: [['wide', 'Geniş'], ['mid', 'Orta'], ['thin', 'İnce']] },
  { key: 'line', label: 'Çizgi', opts: [['dash', 'Kesik kesik'], ['solid', 'Düz (kâğıttaki gibi)']] },
  { key: 'marks', label: 'Başlangıç ve bitiş', hint: 'Yeşil nokta ve ok nereden başlanacağını, yıldız nerede bitirileceğini gösterir.', opts: [[true, 'Göster'], [false, 'Gizle']] },
  { key: 'sound', label: 'Ses efektleri ve seslendirme', opts: [[true, 'Açık'], [false, 'Kapalı']] },
  { key: 'ttsRate', label: 'Konuşma hızı', opts: [['slow', 'Yavaş'], ['normal', 'Normal'], ['fast', 'Hızlı']] }
];
const segRow = g => `<div class="set-row"><div><b>${g.label}</b>${g.hint ? `<small>${g.hint}</small>` : ''}</div>
  <div class="grow"><div class="seg" data-key="${g.key}">${g.opts.map(([v, l]) => `<button type="button" data-v="${String(v)}" aria-pressed="${String(settings[g.key]) === String(v)}">${l}</button>`).join('')}</div></div></div>`;
/*@@SHARED_VOICE@@*/
function openSettings() {
  const before = settings.road + settings.line + settings.marks;
  openModal(`<button type="button" class="sheet-x" aria-label="Kapat">${ICON.close}</button>
    <h2 id="mTitle">Öğretmen ayarları</h2>
    <p class="lead">Ayarlar bu cihazda saklanır. Akıllı tahtada birden fazla çocuk aynı anda çizebilir; ana ekrandan 2 ya da 4 çocuk seçin.</p>
    <h3 class="set-h">Desen</h3>${SEGS.slice(0, 3).map(segRow).join('')}
    <h3 class="set-h">Ses</h3>${SEGS.slice(3).map(segRow).join('')}
    <div class="set-row top"><div><b>Konuşan ses</b><small>Otomatik seçimde önce kadın sesi kullanılır.</small></div><div class="grow" id="voiceBox"></div></div>
    <div class="sheet-foot"><button type="button" class="btn go" id="closeSet">Kaydet ve kapat</button></div>`, sheet => {
    sheet.querySelectorAll('.seg[data-key]').forEach(seg => seg.addEventListener('click', e => {
      const b = e.target.closest('button[data-v]'); if (!b) return;
      const key = seg.dataset.key; let v = b.dataset.v;
      if (key === 'marks' || key === 'sound') v = v === 'true';
      settings[key] = v; saveSettings();
      seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      if (key === 'sound') { if (v) audio.get(); else tts.hush(); }
    }));
    mountVoiceRow(sheet);
    $('.sheet-x', sheet).addEventListener('click', closeModal);
    $('#closeSet', sheet).addEventListener('click', closeModal);
  }, () => {
    if (settings.road + settings.line + settings.marks === before) return;
    if (stage.dataset.screen === 'home') renderHome();
    else panels.forEach(applyLook);
  });
}
/* Görünüm ayarı değişince desen yeniden kurulur; çizimler korunur, ilerleme sıfırlanır. */
function applyLook(p) {
  const acts = p.actions.slice(), bF = p.baseF, bI = p.baseI;
  setTemplate(p, p.tplId, true);
  p.actions = acts; p.baseF = bF; p.baseI = bI; replay(p); syncTools(p);
  if (layout === 1) renderTopbar();
}

/* =========================================================
   Resmi kaydet
   ========================================================= */
let dl = null;
function guideOnCanvas(x, p, ox, oy, k) {
  x.save(); x.translate(ox, oy); x.scale(k, k);
  x.lineCap = 'round'; x.lineJoin = 'round';
  p.strokes.forEach(s => { x.beginPath(); s.pts.forEach((q, j) => j ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1])); if (s.closed) x.closePath(); x.strokeStyle = 'rgba(120,150,185,.2)'; x.lineWidth = p.road; x.stroke(); });
  p.strokes.forEach(s => { x.beginPath(); s.pts.forEach((q, j) => j ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1])); if (s.closed) x.closePath(); x.strokeStyle = settings.line === 'solid' ? '#24272B' : '#55606C'; x.lineWidth = Math.max(3, p.road * 0.09); if (settings.line !== 'solid' && x.setLineDash) x.setLineDash([p.road * 0.34, p.road * 0.26]); x.stroke(); if (x.setLineDash) x.setLineDash([]); });
  x.restore();
}
async function saveImage() {
  const K = 2, gap = 30, foot = 70;
  const tw = panels.reduce((a, p) => a + p.pw, 0) + gap * (panels.length + 1), th = Math.max.apply(null, panels.map(p => p.ph)) + gap * 2 + foot;
  const c = document.createElement('canvas'); c.width = tw * K; c.height = th * K;
  const x = c.getContext('2d'); x.scale(K, K);
  x.fillStyle = '#F4E9D8'; x.fillRect(0, 0, tw, th);
  let ox = gap;
  panels.forEach(p => {
    x.fillStyle = '#FFFFFF'; x.fillRect(ox, gap, p.pw, p.ph);
    x.drawImage(p.cf, ox, gap, p.pw, p.ph);
    guideOnCanvas(x, p, ox, gap, 1);
    x.drawImage(p.ci, ox, gap, p.pw, p.ph);
    if (panels.length > 1) { x.fillStyle = NUM_COL[p.i % 4]; x.beginPath(); x.arc(ox + 26, gap + 26, 18, 0, Math.PI * 2); x.fill(); x.fillStyle = '#fff'; x.font = '700 22px Fredoka, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(p.i + 1), ox + 26, gap + 27); }
    ox += p.pw + gap;
  });
  const d = new Date(), ds = d.toLocaleDateString('tr-TR');
  x.fillStyle = '#5A4A3A'; x.font = '600 28px Fredoka, sans-serif'; x.textAlign = 'left'; x.textBaseline = 'middle';
  x.fillText(`Çizgi Takibi · ${panels.map(p => TPL(p.tplId).name).filter((v, i, a) => a.indexOf(v) === i).join(', ')} · ${ds}`, gap, th - foot / 2 - 6);
  const iso = d.toISOString().slice(0, 10), filename = `cizgi-takibi-${iso}.png`;
  const blob = await new Promise(r => { try { c.toBlob(b => r(b), 'image/png'); } catch (e) { r(null); } });
  if (!blob) { toast('Resim hazırlanamadı.'); return; }
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast('Resim kaydedildi.'); }
    catch (e) { const code = e && e.code; if (code !== 'declined') toast(code === 'rate_limited' ? 'Bir kaydetme penceresi zaten açık.' : 'Resim kaydedilemedi.'); }
    return;
  }
  if (canBlob) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Resim indirildi.');
  } else toast('Bu cihazda kaydetme desteklenmiyor.');
}

/* =========================================================
   Konfeti ve bildirim
   ========================================================= */
const fx = $('#fx'), fctx = fx.getContext('2d');
fx.style.visibility = 'hidden';
let parts = [], fxOn = false;
const COLS = ['#FFD84D', '#3FB068', '#FF8B3A', '#3B8BDF', '#E5579A', '#FFFFFF'];
function startFx() { if (!fxOn) { fxOn = true; fx.style.visibility = 'visible'; requestAnimationFrame(fxLoop); } }
function confetti(x, y, count) {
  if (reduceMotion) return;
  for (let i = 0; i < count; i++) parts.push({ x, y, vx: rand(-8, 8), vy: rand(-15, -4), r: rand(0, 6.28), vr: rand(-.3, .3), w: rand(8, 14), h: rand(10, 18), c: COLS[i % COLS.length], life: rand(70, 115), g: 0.42 });
  startFx();
}
function fxLoop() {
  fctx.clearRect(0, 0, W, H);
  parts = parts.filter(p => p.life-- > 0 && p.y < H + 40);
  for (const p of parts) {
    p.vy += p.g; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r);
    fctx.globalAlpha = Math.min(1, p.life / 22); fctx.fillStyle = p.c;
    fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 2);
    fctx.restore();
  }
  if (parts.length) requestAnimationFrame(fxLoop); else { fxOn = false; fctx.clearRect(0, 0, W, H); fx.style.visibility = 'hidden'; }
}
let toastT = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

/* =========================================================
   Başlat
   ========================================================= */
window.addEventListener('resize', () => { fit(); if (stage.dataset.screen === 'draw') panels.forEach(p => sizeCanvases(p, false)); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { panels.forEach(stopDemo); } });
renderHome();
if (inClaude) { (async () => { try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; } })(); }
})();
</script>
