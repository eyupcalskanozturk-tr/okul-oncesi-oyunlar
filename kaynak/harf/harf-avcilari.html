    const rIn = $('#rosterIn', sheet), rInfo = $('#rosterInfo', sheet);
    const rCheck = () => { const n = parseRoster(rIn.value).length; rInfo.textContent = n ? `${n} öğrenci.` : 'Liste boş. Çocuklar adını yazarak başlar.'; };
    rIn.addEventListener('input', () => { book.roster = parseRoster(rIn.value); store.set(LS.lessons, book); rosterDirty = true; rCheck(); });
    rCheck();
    const n = allEntries().length;
    $('#boardInfo', sheet).textContent = n ? `${n} oyun kayıtlı.` : 'Henüz kayıtlı oyun yok.';
    const csv = $('#csvBtn', sheet); if (csv) csv.addEventListener('click', exportCSV);
    const clr = $('#clearBtn', sheet); let armed = false, armT = 0;
    clr.addEventListener('click', () => {
      if (!armed) { armed = true; clr.textContent = 'Silmek için tekrar dokun'; armT = setTimeout(() => { armed = false; clr.textContent = 'Tabloyu temizle'; }, 4000); return; }
      clearTimeout(armT); armed = false; clr.textContent = 'Tabloyu temizle';
      clearBoard(); $('#boardInfo', sheet).textContent = 'Henüz kayıtlı oyun yok.';
    });
  }, () => { flush(); afterSettings(); });
}

/* ---------- Ders seçme ve düzenleme ---------- */
function selectLesson(id) {
  if (!book.list.some(l => l.id === id)) return;
  settings.lesson = id; saveSettings();
  refreshAfterContent();
  toast(`Ders: ${lesson().name}`);
}
function openLessons() {
  const curId = lesson().id;
  openModal(`<button type="button" class="sheet-x" aria-label="Kapat">${ICON_CLOSE}</button>
    <h2 id="mTitle">Ders seç</h2><p class="lead">Seçtiğin dersin harf, sayı ve kelimeleri bütün oyunlarda kullanılır. Skorlar ders ders ayrı tutulur.</p>
    <div class="ls-list">${book.list.map(l => `<div class="ls-row${l.id === curId ? ' cur' : ''}"><button type="button" class="ls-pick" data-pick="${esc(l.id)}"><span class="f-badge">${esc(focusLetter(l))}</span><span class="ls-meta"><b>${esc(l.name)}${l.id === curId ? '<span class="ls-cur">Seçili</span>' : ''}</b><small>${esc(lessonMeta(l))}</small></span></button><button type="button" class="btn ghost" data-edit="${esc(l.id)}">Düzenle</button></div>`).join('')}</div>
    <div class="sheet-foot"><button type="button" class="btn plain" id="lsNew" style="font-size:24px;padding:12px 26px">+ Yeni ders ekle</button></div>`, sheet => {
    sheet.addEventListener('click', e => {
      if (e.target.closest('.sheet-x')) { closeModal(); return; }
      const p = e.target.closest('[data-pick]'); if (p) { closeModal(); selectLesson(p.dataset.pick); return; }
      const ed = e.target.closest('[data-edit]'); if (ed) { openLessonEditor(ed.dataset.edit); return; }
      if (e.target.closest('#lsNew')) openLessonEditor(null);
    });
  });
}
function openLessonEditor(id) {
  const found = id ? book.list.find(l => l.id === id) : null, isNew = !found;
  const src = found || { id: 'd' + uid().replace(/[^a-z0-9]/gi, '').slice(0, 20), name: '', mascot: 'stork', focus: 'A', letters: DEFAULT_L.join(', '), numbers: DEFAULT_N.join(', '),
    words: '', prompts: GENERIC_PROMPTS.join('\n'), rhymeTitle: '', rhymeText: '' };
  let mascot = src.mascot;
  openModal(`<button type="button" class="sheet-x" aria-label="Kapat">${ICON_CLOSE}</button>
    <h2 id="mTitle">${isNew ? 'Yeni içerik' : 'İçerik'}</h2>
    <p class="lead">Buradaki harf, sayı ve kelimeler bu dosyadaki bütün oyunlarda kullanılır.</p>
    <div class="set-row top"><div><b>Başlık</b><small>Skor tablosunda ve CSV dosyasında görünür.</small></div><div class="grow"><input class="set-in" id="lnName" maxlength="60" value="${esc(src.name)}"><p class="info warn" id="lnNameErr" hidden>Derse bir ad ver.</p></div></div>
    <div class="set-row"><div><b>Maskot</b><small>Köşede duran ve tekerleme ekranında görünen kahraman.</small></div><div class="seg" id="lnMascot">${[['stork', 'Leylek'], ['donkey', 'Eşek']].concat(OCTO[0].src ? [['octopus', 'Ahtapot']] : []).map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${mascot === v}">${t}</button>`).join('')}</div></div>
    <div class="set-row top"><div><b>Odak harf</b><small>Tekerleme ekranında yanıp söner; gruplama, test ve konuşma kartları bu sesi sorar.</small></div><div class="grow"><input class="set-in short" id="lnFocus" maxlength="1" spellcheck="false" value="${esc(focusLetter(src))}"><p class="info" id="lnFocusInfo"></p></div></div>
    <div class="set-row top"><div><b>Harfler</b><small>Hikâyede geçen harfler. Virgülle ayır.</small></div><div class="grow"><input class="set-in" id="lnLetters" spellcheck="false" value="${esc(src.letters)}"><p class="info" id="lnLettersInfo"></p></div></div>
    <div class="set-row top"><div><b>Sayılar</b><small>0 ile 99 arası. Virgülle ayır.</small></div><div class="grow"><input class="set-in" id="lnNumbers" spellcheck="false" inputmode="numeric" value="${esc(src.numbers)}"><p class="info" id="lnNumbersInfo"></p></div></div>
    <div class="set-row top"><div><b>Kelimeler</b><small>Virgülle ayır. Mandal oyunu en fazla 9 harfli kelimeleri kullanır.</small></div><div class="grow"><textarea id="lnWords" spellcheck="false" aria-label="Kelimeler">${esc(src.words)}</textarea><p class="info" id="lnWordsInfo"></p><p class="info">Resmi hazır kelimeler: ${PIC_NAMES}.</p></div></div>
    <div class="set-row top"><div><b>Konuşma kartları</b><small>Her satır bir kart. {harf} yazdığın yere odak harf gelir.</small></div><div class="grow"><textarea class="mid" id="lnPrompts" spellcheck="false" aria-label="Konuşma kartları">${esc(src.prompts)}</textarea></div></div>
    <div class="set-row"><div><b>Tekerleme başlığı</b></div><div class="grow"><input class="set-in" id="lnRhTitle" maxlength="60" value="${esc(src.rhymeTitle)}"></div></div>
    <div class="set-row top"><div><b>Tekerleme dizeleri</b><small>Her dizeyi ayrı satıra yaz. En fazla 12 satır gösterilir.</small></div><div class="grow"><textarea class="mid" id="lnRhText" spellcheck="false" aria-label="Tekerleme dizeleri">${esc(src.rhymeText)}</textarea></div></div>
    <div class="sheet-foot spread">${isNew || book.list.length < 2 ? '' : '<button type="button" class="btn danger" id="lnDel">Dersi sil</button>'}<span class="grow"></span><button type="button" class="btn ghost" id="lnCancel">Vazgeç</button><button type="button" class="btn go" id="lnSave" style="font-size:28px;padding:12px 34px">Kaydet</button></div>`, sheet => {
    const q = s => $(s, sheet);
    q('.sheet-x').addEventListener('click', closeModal);
    q('#lnCancel').addEventListener('click', closeModal);
    q('#lnName').addEventListener('input', () => { q('#lnNameErr').hidden = true; });
    q('#lnMascot').addEventListener('click', e => {
      const b = e.target.closest('button[data-v]'); if (!b) return;
      mascot = b.dataset.v;
      q('#lnMascot').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    });
    const check = () => {
      const l = parseSet(q('#lnLetters').value, 'L'), n = parseSet(q('#lnNumbers').value, 'N'), w = parseWords(q('#lnWords').value);
      const look = l.ok.filter(c => LOOKALIKE.indexOf(c) >= 0);
      const li = q('#lnLettersInfo'), ni = q('#lnNumbersInfo'), fi = q('#lnFocusInfo'), wi = q('#lnWordsInfo');
      li.classList.toggle('warn', !l.ok.length || l.bad.length > 0);
      li.textContent = !l.ok.length ? `Liste boş. Oyunlar ${DEFAULT_L.join(', ')} harflerini kullanır.`
        : `${l.ok.length} harf hazır: ${l.ok.join(' ')}.` + (l.bad.length ? ` Alınmayanlar: ${l.bad.slice(0, 6).join(', ')}.` : '') +
          (look.length ? ` ${look.join(', ')} sayıya benzediği için balon oyununu zorlaştırır.` : '');
      ni.classList.toggle('warn', !n.ok.length || n.bad.length > 0);
      ni.textContent = !n.ok.length ? `Liste boş. Oyunlar ${DEFAULT_N.join(', ')} sayılarını kullanır.`
        : `${n.ok.length} sayı hazır: ${n.ok.join(' ')}.` + (n.bad.length ? ` Alınmayanlar: ${n.bad.slice(0, 6).join(', ')}.` : '');
      const fv = upperTR(q('#lnFocus').value.trim()), fok = fv && TR_LETTERS.indexOf(fv) >= 0, F = fok ? fv : 'L', fw = w.ok.filter(x => x.f === F);
      fi.classList.toggle('warn', !fok || !fw.length);
      fi.textContent = !fok ? 'Tek bir harf yaz.' : fw.length ? `${F} ile başlayan kelimeler: ${fw.map(x => x.w).join(', ')}.` : `Listede ${F} ile başlayan kelime yok; “${F} ile başlayanlar” oyunları için birkaç kelime ekle.`;
      const long = w.ok.filter(x => x.k.length > 9 || x.k.indexOf(' ') >= 0).map(x => x.w);
      wi.classList.toggle('warn', !w.ok.length || w.bad.length > 0);
      wi.textContent = !w.ok.length ? 'Liste boş. Kelime eklenene kadar oyunlar örnek kelimeleri kullanır.'
        : `${w.ok.length} kelime hazır, ${w.ok.filter(x => x.pic).length} tanesinin resmi var.` + (w.bad.length ? ` Alınmayanlar: ${w.bad.slice(0, 6).join(', ')}.` : '') +
          (long.length ? ` Mandal oyununda kullanılmayacak kelimeler: ${long.slice(0, 4).join(', ')}.` : '');
    };
    ['#lnLetters', '#lnNumbers', '#lnWords', '#lnFocus'].forEach(s => q(s).addEventListener('input', check));
    check();
    q('#lnSave').addEventListener('click', () => {
      const name = q('#lnName').value.trim();
      if (!name) { q('#lnNameErr').hidden = false; q('#lnName').focus(); return; }
      const obj = sanitizeLesson({ id: src.id, name, mascot, focus: upperTR(q('#lnFocus').value.trim().charAt(0)), letters: q('#lnLetters').value, numbers: q('#lnNumbers').value,
        words: q('#lnWords').value, prompts: q('#lnPrompts').value, rhymeTitle: q('#lnRhTitle').value.trim(), rhymeText: q('#lnRhText').value });
      if (!obj) return;
      if (isNew) { book.list.push(obj); settings.lesson = obj.id; store.set(LS.settings, settings); }
      else book.list[book.list.indexOf(found)] = obj;
      saveBook();
      closeModal();
      refreshAfterContent();
      toast(isNew ? 'Yeni ders eklendi ve seçildi.' : 'Ders kaydedildi.');
    });
    const del = q('#lnDel');
    if (del) {
      let armed = false, armT = 0;
      del.addEventListener('click', () => {
        if (!armed) { armed = true; del.textContent = 'Silmek için tekrar dokun'; armT = setTimeout(() => { armed = false; del.textContent = 'Dersi sil'; }, 4000); return; }
        clearTimeout(armT);
        book.list = book.list.filter(l => l.id !== src.id);
        if (settings.lesson === src.id) { settings.lesson = book.list[0].id; store.set(LS.settings, settings); }
        saveBook();
        closeModal();
        refreshAfterContent();
        toast('Ders silindi. Skorları CSV dosyasında kalır.');
      });
    }
  });
}

/* =========================================================
   Patlama parçacıkları, konfeti, bildirim
   ========================================================= */
const fx = $('#fx'), fctx = fx.getContext('2d');
fx.style.visibility = 'hidden';
let parts = [], fxOn = false;
const COLS = ['#FFD84D', '#3FB068', '#FF8B3A', '#3B8BDF', '#E5579A', '#FFFFFF'];
function startFx() { if (!fxOn) { fxOn = true; fx.style.visibility = 'visible'; requestAnimationFrame(fxLoop); } }
function burst(x, y, color) {
  if (reduceMotion) return;
  for (let i = 0; i < 18; i++) {
    const a = rand(0, 6.28), sp = rand(3, 9);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, r: rand(0, 6.28), vr: rand(-.4, .4), w: rand(6, 12), h: rand(8, 15), c: i % 4 ? color : '#FFFFFF', life: rand(26, 44), g: 0.38 });
  }
  startFx();
}
function confetti(x, y, count) {
  if (reduceMotion) return;
  for (let i = 0; i < count; i++) parts.push({ x, y, vx: rand(-8, 8), vy: rand(-15, -4), r: rand(0, 6.28), vr: rand(-.3, .3), w: rand(8, 14), h: rand(10, 18), c: COLS[i % COLS.length], life: rand(70, 115), g: 0.42 });
  startFx();
}
function fxLoop() {
  fctx.clearRect(0, 0, W, H);
  parts = parts.filter(p => p.life-- > 0 && p.y < H + 40);
  for (const p of parts) {
    p.vy += p.g; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r);
    fctx.globalAlpha = Math.min(1, p.life / 22); fctx.fillStyle = p.c;
    fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 2);
    fctx.restore();
  }
  if (parts.length) requestAnimationFrame(fxLoop); else { fxOn = false; fctx.clearRect(0, 0, W, H); fx.style.visibility = 'hidden'; }
}
let toastT = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

  const pending = store.get(LS.pending, null);
  if (validEntry(pending)) {
    normEntry(pending);
    if (!localEntries.some(e => e.id === pending.id)) { localEntries.push(pending); persistLocal(); }
    store.del(LS.pending);
  }
  importMandalScores();
  importCombined();
  $('#homeTitle').textContent = EDITION.title;
  document.title = EDITION.title;
  stork.el.insertAdjacentHTML('beforeend', storkSVG() + donkeySVG() + octoMascot(focusLetter()));
  renderTiles();
  stork.blink();
  updateLessonUI();
  updateSummary();
  updateAudioBtns();
  updateBlinkBtn();
  refreshRecent();
  show('home');
  setStatus('local');
  updateExportBtn();
  initCloud();
  setTimeout(() => { if (stage.dataset.screen === 'home') stork.mood('idle', 'Merhaba! Bir oyun seç.', 4200); }, 500);
  if (newLessonNote) setTimeout(() => toast(newLessonNote), 900);
})();

})();
